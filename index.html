<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tarot Compendium</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHBhdGggZD0iTTYgMzIgUTMyIDEyIDU4IDMyIFEzMiA1MiA2IDMyIFoiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2Q0YWM1ZSIgc3Ryb2tlLXdpZHRoPSIzIi8+PHBhdGggZD0iTTM4IDIyYTExIDExIDAgMSAwIDAgMjAgMTMuNSAxMy41IDAgMCAxIDAtMjB6IiBmaWxsPSIjZDRhYzVlIi8+PC9zdmc+Cg==">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --ink:#211a14;
  --parchment:#ece4d1;
  --parchment-dim:#ded3ba;
  --leather:#241b16;
  --leather-2:#332720;
  --brass:#b6903f;
  --brass-bright:#d4ac5e;
  --oxblood:#6e2a34;
  --sage:#6f7d5e;
  --indigo:#4b5a7a;
  --herb:#4f7942;
  --violet:#6b5b95;
  --teal:#3d7068;
  --line: rgba(33,26,20,0.18);
  --shadow: 0 8px 24px rgba(20,14,8,0.25);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--leather);
  background-image:
    radial-gradient(ellipse at top left, rgba(182,144,63,0.06), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(110,42,52,0.10), transparent 55%);
  color: var(--ink);
  font-family: 'Source Serif 4', Georgia, serif;
  min-height:100vh;
}

/* ---------- header ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background: linear-gradient(180deg, var(--leather-2), var(--leather));
  border-bottom: 2px solid var(--brass);
  padding: 14px 22px;
  display:flex; align-items:center; gap:18px;
  box-shadow: var(--shadow);
}
.brand{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size: 22px;
  color: var(--brass-bright);
  letter-spacing:0.03em;
  white-space:nowrap;
  display:flex; align-items:center; gap:10px;
}
.brand .mark{
  width:28px; height:28px;
  display:inline-flex; align-items:center; justify-content:center;
}
.brand .mark svg{ width:100%; height:100%; }
.search-wrap{ flex:1; max-width:420px; }
.search-wrap input{
  width:100%; padding:9px 14px;
  background: rgba(236,228,209,0.08);
  border:1px solid rgba(212,172,94,0.35);
  border-radius:20px;
  color: var(--parchment);
  font-family:'Source Serif 4', serif;
  font-size:14px;
  outline:none;
}
.search-wrap input::placeholder{ color: rgba(236,228,209,0.45); }
.search-wrap input:focus{ border-color: var(--brass-bright); }

.topbar-actions{ margin-left:auto; display:flex; gap:10px; align-items:center; }
.sync-status{
  font-family:'JetBrains Mono',monospace; font-size:11px;
  color: rgba(236,228,209,0.55);
  display:flex; align-items:center; gap:6px;
}
.sync-status .dot{ width:7px; height:7px; border-radius:50%; background:#8a8a8a; display:inline-block; }
.sync-status.ok .dot{ background:#7a9e6b; }
.sync-status.error .dot{ background:var(--oxblood); }
.sync-status.busy .dot{ background: var(--brass-bright); animation: pulse 1s infinite ease-in-out; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
.btn{
  font-family:'Source Serif 4', serif;
  font-size:14px;
  padding:9px 16px;
  border-radius:6px;
  border:1px solid var(--brass);
  background:transparent;
  color: var(--brass-bright);
  cursor:pointer;
  transition: all .15s ease;
}
.btn:hover{ background: rgba(212,172,94,0.12); }
.btn.primary{
  background: var(--brass);
  color: var(--leather);
  font-weight:600;
  border-color: var(--brass);
}
.btn.primary:hover{ background: var(--brass-bright); }
.btn.ghost{ border-color: rgba(236,228,209,0.25); color: rgba(236,228,209,0.75); }
.btn.small{ font-size:12px; padding:5px 10px; }

/* ---------- main / grid ---------- */
main{ max-width:1180px; margin:0 auto; padding:30px 22px 80px; }
.suit-heading{
  font-family:'Fraunces', serif;
  font-size:15px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color: var(--parchment);
  opacity:0.7;
  margin: 34px 0 14px;
  display:flex; align-items:center; gap:12px;
}
.suit-heading::after{
  content:''; flex:1; height:1px; background: rgba(236,228,209,0.2);
}
.grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
  gap:14px;
}
.card-tile{
  background: var(--parchment);
  background-image: linear-gradient(160deg, var(--parchment), var(--parchment-dim));
  border-radius:8px;
  padding:16px 14px;
  cursor:pointer;
  position:relative;
  border: 1px solid rgba(33,26,20,0.15);
  box-shadow: 0 3px 8px rgba(20,14,8,0.28);
  transition: transform .15s ease, box-shadow .15s ease;
  min-height:108px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.card-tile:hover{ transform: translateY(-3px); box-shadow: 0 8px 18px rgba(20,14,8,0.4); }
.card-tile::before{
  content:''; position:absolute; top:8px; right:8px; width:8px; height:8px;
  border-radius:50%; background: var(--brass); opacity:0.5;
}
.card-num{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  color: var(--oxblood);
  opacity:0.75;
  letter-spacing:0.05em;
}
.card-name{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:16px;
  line-height:1.25;
  margin-top:8px;
}
.card-count{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  color: var(--sage);
  margin-top:10px;
}
.card-count.empty{ opacity:0.4; }
.card-tile.add-tile{
  background: transparent;
  border: 2px dashed rgba(236,228,209,0.35);
  box-shadow:none;
  align-items:center; justify-content:center; text-align:center;
  color: rgba(236,228,209,0.65);
}
.card-tile.add-tile:hover{ border-color: var(--brass-bright); color: var(--brass-bright); background: rgba(236,228,209,0.05); }
.card-tile.add-tile::before{ display:none; }

/* ---------- card detail (compiled page) ---------- */
#cardView{ display:none; }
.page-header{
  display:flex; align-items:flex-end; justify-content:space-between;
  border-bottom: 2px solid var(--brass);
  padding-bottom:16px; margin-bottom:26px;
  flex-wrap:wrap; gap:12px;
}
.back-link{
  font-family:'JetBrains Mono',monospace;
  font-size:12px; color: var(--brass-bright);
  cursor:pointer; opacity:0.85;
  margin-bottom:10px; display:inline-block;
}
.back-link:hover{ opacity:1; text-decoration:underline; }
.page-title-block .eyebrow{
  font-family:'JetBrains Mono',monospace; font-size:12px;
  color: var(--brass-bright); opacity:0.75; letter-spacing:0.1em;
}
.eyebrow-link{ color: var(--brass-bright); text-decoration:underline; cursor:pointer; opacity:1; }
.eyebrow-link:hover{ color:#fff; }
.page-title{
  font-family:'Fraunces', serif; font-weight:700;
  font-size:38px; color: var(--parchment);
}
.entries{ display:flex; flex-direction:column; gap:18px; }
.entry{
  background: var(--parchment);
  border-radius:8px;
  padding:20px 24px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--brass);
  transition: opacity .15s ease, border-top-color .1s ease;
}
.entry.dragging{ opacity:0.4; }
.entry.has-images{
  border-left-color: var(--sage);
  background-color: color-mix(in srgb, var(--parchment) 85%, var(--sage) 15%);
}
.entry.astro-display{
  border-left-color: var(--violet);
  background-color: color-mix(in srgb, var(--parchment) 85%, var(--violet) 15%);
}
.entry.is-keywords{
  border-left-color: var(--oxblood);
  background-color: color-mix(in srgb, var(--parchment) 85%, var(--oxblood) 15%);
}
.entry.is-keywords .entry-body{ font-weight:700; font-size:20px; line-height:1.4; }
.entry.is-guidance{
  border-left-color: var(--indigo);
  background-color: color-mix(in srgb, var(--parchment) 85%, var(--indigo) 15%);
}
.entry.is-herb{
  border-left-color: var(--herb);
  background-color: color-mix(in srgb, var(--parchment) 85%, var(--herb) 15%);
}
.entry.is-herb .entry-body{ font-weight:700; font-size:18px; line-height:1.5; }
.entry.is-numerology{
  border-left-color: var(--teal);
  background-color: color-mix(in srgb, var(--parchment) 85%, var(--teal) 15%);
}
.field-label-inline{ font-weight:700; text-transform:uppercase; }
.entry-source{
  margin-top:10px;
  font-size:13px;
  font-style:italic;
  color:#8a7a63;
}
.entry-source a{ color:#8a7a63; }
.entry-astro{
  margin-top:8px;
  font-size:13px;
  font-family:'JetBrains Mono',monospace;
  color: var(--sage);
}
.entry.drag-over{ border-top:3px solid var(--oxblood); }
.drag-handle{ cursor:grab; opacity:0.45; margin-right:8px; letter-spacing:-2px; }
.drag-handle:hover{ opacity:0.8; }
.drag-handle:active{ cursor:grabbing; }
.entry-meta{
  display:flex; justify-content:space-between; align-items:center;
  font-family:'JetBrains Mono',monospace; font-size:11px;
  color: var(--oxblood); opacity:0.7; margin-bottom:10px;
}
.entry-actions{ display:flex; gap:8px; }
.entry-actions span{ cursor:pointer; opacity:0.6; }
.entry-actions span:hover{ opacity:1; }
.entry-body{ font-size:16px; line-height:1.65; }
.entry-body img{ width:200px; height:345px; max-width:100%; object-fit:fill; border-radius:6px; margin:6px 8px 6px 0; vertical-align:top; cursor:zoom-in; }
.entry-body p{ margin:0 0 10px; }
.entry-body ul, .entry-body ol{ margin:0 0 10px; padding-left:22px; }
.entry-body blockquote{
  border-left:3px solid var(--sage); margin:10px 0; padding:4px 0 4px 14px;
  font-style:italic; color:#3a3226;
}
.empty-state{
  text-align:center; padding:60px 20px; color: rgba(236,228,209,0.55);
  font-family:'Cormorant Garamond', serif; font-size:20px; font-style:italic;
}

/* ---------- modal ---------- */
.overlay{
  display:none; position:fixed; inset:0; z-index:50;
  background: rgba(20,14,8,0.6);
  align-items:center; justify-content:center; padding:20px;
}
.overlay.open{ display:flex; }
.modal{
  background: var(--parchment);
  width:100%; max-width:640px; max-height:88vh;
  border-radius:10px; overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  border:1px solid var(--brass);
}
.modal-header{
  padding:16px 22px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  background: var(--parchment-dim);
}
.modal-header h3{ margin:0; font-family:'Fraunces', serif; font-size:19px; }
.modal-close{ cursor:pointer; font-size:20px; opacity:0.6; background:none; border:none; }
.modal-close:hover{ opacity:1; }
.modal-body{ padding:18px 22px; overflow-y:auto; flex:1; }

.tag-select{ position:relative; margin-bottom:14px; }
.tag-select label, .field-label{
  display:block; font-family:'JetBrains Mono',monospace; font-size:11px;
  text-transform:uppercase; letter-spacing:0.08em; color:#5c4f3d; margin-bottom:6px;
}
.tag-input{
  width:100%; padding:8px 12px; border:1px solid rgba(33,26,20,0.25);
  border-radius:6px; font-family:'Source Serif 4',serif; font-size:14px;
}
.tag-dropdown{
  position:absolute; top:100%; left:0; right:0; background:#fff;
  border:1px solid rgba(33,26,20,0.25); border-radius:6px; max-height:180px;
  overflow-y:auto; z-index:10; box-shadow: 0 6px 16px rgba(0,0,0,0.2); display:none;
}
.tag-dropdown.open{ display:block; }
.tag-option{ padding:7px 12px; font-size:14px; cursor:pointer; }
.tag-option:hover{ background: var(--parchment-dim); }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip{
  background: var(--oxblood); color:#fff; font-size:12px; padding:4px 10px;
  border-radius:12px; display:flex; align-items:center; gap:6px;
  font-family:'JetBrains Mono',monospace;
}
.chip span{ cursor:pointer; opacity:0.8; }
.chip span:hover{ opacity:1; }

.toolbar{
  display:flex; gap:4px; padding:6px; background: var(--parchment-dim);
  border:1px solid rgba(33,26,20,0.2); border-bottom:none;
  border-radius:6px 6px 0 0; flex-wrap:wrap;
}
.toolbar button{
  width:30px; height:30px; border:none; background:transparent;
  border-radius:4px; cursor:pointer; font-size:14px; color:var(--ink);
}
.toolbar button:hover{ background: rgba(33,26,20,0.1); }
.toolbar button:disabled{ opacity:0.35; cursor:not-allowed; }
.toolbar button:disabled:hover{ background:transparent; }
#codeToggleBtn{ width:auto; padding:0 10px; font-family:'JetBrains Mono',monospace; font-size:12px; }
#codeToggleBtn.active{ background: var(--brass); color:#fff; }
.toolbar button.b{ font-weight:700; }
.toolbar button.i{ font-style:italic; }
.editor{
  min-height:150px; max-height:320px; overflow-y:auto;
  border:1px solid rgba(33,26,20,0.2); border-radius:0 0 6px 6px;
  padding:12px 14px; font-size:15px; line-height:1.6; background:#fff;
  outline:none;
}
.editor img{ width:200px; height:345px; max-width:100%; object-fit:fill; border-radius:6px; margin:6px 8px 6px 0; vertical-align:top; }
.editor:empty:before{ content: attr(data-placeholder); color:#9c9182; }

.modal-footer{
  padding:14px 22px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center;
  background: var(--parchment-dim);
}
input[type=file]{ display:none; }

/* ---------- fab ---------- */
.app-footer{
  display:flex; justify-content:center; align-items:center; gap:14px;
  padding:24px 22px 90px;
  opacity:0.9;
}
.fab{
  position:fixed; bottom:28px; right:28px; z-index:30;
  background: var(--brass); color: var(--leather);
  border:none; border-radius:30px; padding:14px 22px;
  font-family:'Fraunces',serif; font-weight:600; font-size:15px;
  cursor:pointer; box-shadow: 0 8px 22px rgba(0,0,0,0.4);
  display:flex; align-items:center; gap:8px;
}
.fab:hover{ background: var(--brass-bright); }

.hidden{ display:none !important; }
.lightbox-overlay{
  display:none; position:fixed; inset:0; z-index:80;
  background: rgba(10,7,4,0.9);
  align-items:center; justify-content:center; padding:24px;
  cursor:zoom-out;
}
.lightbox-overlay.open{ display:flex; }
.lightbox-overlay img{ max-width:90vw; max-height:90vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,0.6); }
@media (max-width:600px){
  .page-title{ font-size:28px; }
  .brand span.txt{ display:none; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" id="brandLink" style="cursor:pointer;"><span class="mark"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M6 32 Q32 12 58 32 Q32 52 6 32 Z" fill="none" stroke="#d4ac5e" stroke-width="3"/><path d="M38 22a11 11 0 1 0 0 20 13.5 13.5 0 0 1 0-20z" fill="#d4ac5e"/></svg></span><span class="txt">My Tarot Compendium</span></div>
  <div class="search-wrap"><input id="searchBox" placeholder="Search cards…"/></div>
  <div class="topbar-actions">
    <span id="noteCount" class="sync-status"></span>
    <span id="syncStatus" class="sync-status"></span>
    <button class="btn ghost small" id="syncNowBtn" style="display:none;">Sync now</button>
    <button class="btn ghost small" id="dropboxBtn">Connect Dropbox</button>
  </div>
</div>

<main>
  <div id="homeView"></div>

  <div id="cardView">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="back-link" id="backLink">← all cards</span>
      <div class="card-nav" id="cardNav" style="display:none; gap:16px; font-family:'JetBrains Mono',monospace; font-size:12px;">
        <span class="back-link" id="prevCardLink"></span>
        <span class="back-link" id="nextCardLink"></span>
      </div>
    </div>
    <div class="page-header">
      <div class="page-title-block">
        <div class="eyebrow" id="pageEyebrow"></div>
        <div class="page-title" id="pageTitle"></div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn ghost" id="deletePageBtn" style="display:none;">Delete this page</button>
        <button class="btn primary" id="addNoteForThisCard">+ Add note to this page</button>
      </div>
    </div>
    <div class="entries" id="entries"></div>
  </div>

  <div id="sourcesView" style="display:none;">
    <span class="back-link" id="sourcesBackLink">← all cards</span>
    <div class="page-header">
      <div class="page-title-block">
        <div class="eyebrow">Auto-generated · updates as you add sources</div>
        <div class="page-title">Sources</div>
      </div>
    </div>
    <div class="entries" id="sourcesList"></div>
  </div>

  <div id="astrologyView" style="display:none;">
    <span class="back-link" id="astrologyBackLink">← all cards</span>
    <div class="page-header">
      <div class="page-title-block">
        <div class="eyebrow">All 78 cards · type directly into any field, saves automatically</div>
        <div class="page-title">Astrology</div>
      </div>
    </div>
    <div class="entries" id="astrologyList"></div>
  </div>
</main>

<footer class="app-footer">
  <span class="back-link" id="sourcesLink" style="cursor:pointer; margin-bottom:0;">Sources</span>
  <span class="back-link" id="astrologyLink" style="cursor:pointer; margin-bottom:0;">Astrology</span>
  <button class="btn ghost small" id="exportBtn">Export backup</button>
  <button class="btn ghost small" id="importBtn">Import</button>
  <input type="file" id="importFile" accept=".json"/>
</footer>

<button class="fab" id="fabAdd">✎ New note</button>

<div class="lightbox-overlay" id="lightboxOverlay">
  <img id="lightboxImg" src="" alt=""/>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">New note</h3>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="tag-select">
        <label>Tag to card(s)</label>
        <input class="tag-input" id="tagInput" placeholder="Type to search a card…" autocomplete="off"/>
        <div class="tag-dropdown" id="tagDropdown"></div>
        <div class="chips" id="chips"></div>
      </div>

      <label class="field-label">Order</label>
      <input type="number" class="tag-input" id="orderInput" placeholder="lower numbers show first — leave blank to just add to the end"/>
      <label class="field-label" style="margin-top:10px;">Note type</label>
      <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:4px;">
        <label style="display:flex; align-items:center; gap:6px; font-family:'Source Serif 4',serif; font-size:14px; cursor:pointer; color:#3a3226;">
          <input type="checkbox" id="keywordsInput" style="width:auto;"/> Keywords
        </label>
        <label style="display:flex; align-items:center; gap:6px; font-family:'Source Serif 4',serif; font-size:14px; cursor:pointer; color:#3a3226;">
          <input type="checkbox" id="guidanceInput" style="width:auto;"/> Guidance
        </label>
        <label style="display:flex; align-items:center; gap:6px; font-family:'Source Serif 4',serif; font-size:14px; cursor:pointer; color:#3a3226;">
          <input type="checkbox" id="herbInput" style="width:auto;"/> Herb
        </label>
      </div>
      <label style="display:flex; align-items:center; gap:8px; margin:6px 0 4px; font-family:'Source Serif 4',serif; font-size:14px; cursor:pointer; color:#3a3226;">
        <input type="checkbox" id="pinFirstInput" style="width:auto;"/> Always show first (after any images)
      </label>

      <label class="field-label" style="margin-top:10px;">Note</label>
      <div class="toolbar">
        <button class="b" data-cmd="bold" title="Bold">B</button>
        <button class="i" data-cmd="italic" title="Italic">I</button>
        <button data-cmd="underline" title="Underline"><u>U</u></button>
        <button data-cmd="insertUnorderedList" title="Bullet list">• ―</button>
        <button data-cmd="insertOrderedList" title="Numbered list">1.</button>
        <button data-cmd="formatBlock:BLOCKQUOTE" title="Quote">"</button>
        <button id="imgBtn" title="Insert image">🖼</button>
        <input type="file" id="imgFile" accept="image/*" multiple/>
        <button id="codeToggleBtn" title="View/edit raw HTML" style="margin-left:auto;">&lt;/&gt;</button>
      </div>
      <div class="editor" id="editor" contenteditable="true" data-placeholder="Write your note here…"></div>
      <textarea class="editor" id="editorCode" style="display:none; width:100%; font-family:'JetBrains Mono',monospace; font-size:13px; resize:vertical;"></textarea>

      <label class="field-label" style="margin-top:14px;">Source</label>
      <input type="text" class="tag-input" id="sourceInput" placeholder="optional"/>
      <label class="field-label" style="margin-top:10px;">Link</label>
      <input type="text" class="tag-input" id="sourceLinkInput" placeholder="https://…"/>
    </div>
    <div class="modal-footer">
      <button class="btn ghost" id="deleteNoteBtn" style="display:none;">Delete note</button>
      <button class="btn primary" id="saveNoteBtn">Save note</button>
    </div>
  </div>
</div>

<script>
// ---------- card data ----------
const MAJOR = ["The Fool","The Magician","The High Priestess","The Empress","The Emperor","The Hierophant","The Lovers","The Chariot","Strength","The Hermit","Wheel of Fortune","Justice","The Hanged Man","Death","Temperance","The Devil","The Tower","The Star","The Moon","The Sun","Judgement","The World"];
const SUITS = [
  {name:"Wands", symbol:"🜂"},
  {name:"Cups", symbol:"🜄"},
  {name:"Swords", symbol:"🜁"},
  {name:"Pentacles", symbol:"🜃"}
];
const RANKS = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"];
const PIP_RANKS = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];
const COURT_RANKS = ["Page","Knight","Queen","King"];

const CARDS = [];
MAJOR.forEach((name,i)=>{
  CARDS.push({id:"major-"+i, name, eyebrow:"Major Arcana · "+(i===0?"0":i), group:"Major Arcana"});
});
SUITS.forEach(suit=>{
  RANKS.forEach((rank,i)=>{
    const name = rank+" of "+suit.name;
    const rankType = PIP_RANKS.includes(rank) ? 'pip' : 'court';
    CARDS.push({id:(suit.name+"-"+rank).toLowerCase().replace(/\s+/g,'-'), name, eyebrow:"Minor Arcana · "+suit.name, group:suit.name, rank, rankType});
  });
});

const GROUP_ORDER = ["Major Arcana","Wands","Cups","Swords","Pentacles"];

// Group-wide tags: tag a note to "Wands (all cards)" and it automatically
// appears on every Wands card's page too, alongside that card's own notes.
function groupSlug(name){ return 'group-' + name.toLowerCase().replace(/\s+/g,'-'); }
const GROUP_TAGS = GROUP_ORDER.map(g => ({
  id: groupSlug(g),
  name: g + ' (all cards)',
  eyebrow: 'Suit-wide tag — appears on every card below',
  group: 'Suit & Arcana Tags'
}));

// Court cards: an overview tag (for general court-card notes), plus four
// rank tags (Page/Knight/Queen/King) that each cascade only to that rank
// across the four suits — e.g. tagging "Queen" puts a note on the Queen of
// Wands, Cups, Swords, and Pentacles, not on every court card.
const COURT_TAG = {
  id: 'court-cards',
  name: 'Court Cards (all suits)',
  eyebrow: 'Every court-card note, all ranks together',
  group: 'Suit & Arcana Tags'
};
const COURT_RANK_TAGS = COURT_RANKS.map(r => ({
  id: 'court-' + r.toLowerCase(),
  name: r + ' (all suits)',
  eyebrow: 'Cascades to every ' + r + ' across the four suits',
  group: 'Court Ranks'
}));

// Minor Arcana Pips: a taggable overview page (for general pip notes), plus
// ten underlying number tags (Ace–Ten) that each cascade to the matching
// rank across all four suits — e.g. tagging "Three" puts a note on the
// Three of Wands, Cups, Swords, and Pentacles all at once. Notes on the
// overview page sort by their number rather than date/manual order.
const PIP_OVERVIEW_TAG = {
  id: 'pip-overview',
  name: 'Minor Arcana Pips',
  eyebrow: 'Every numbered pip note, sorted 1–10',
  group: 'Suit & Arcana Tags'
};
const PIP_RANK_TAGS = PIP_RANKS.map((r,i) => ({
  id: 'pip-' + r.toLowerCase(),
  name: r + ' (all suits)',
  eyebrow: 'Cascades to every ' + r + ' across the four suits',
  group: 'Pip Numbers',
  pipNumber: i+1
}));

// ---------- custom / broader pages (suit overviews, numerology, themes, etc.) ----------
let CUSTOM_PAGES = []; // {id, name}

// Dedicated per-card fields — Astrology, Keywords, Guidance — separate from
// the notes stream. One entry per real deck card, edited directly on that
// card's page rather than through the note composer.
let CARD_FIELDS = {}; // { [cardId]: {astro, keywords, guidance, updatedAt} }

function allPages(){
  return CARDS.concat(GROUP_TAGS).concat([COURT_TAG, PIP_OVERVIEW_TAG]).concat(COURT_RANK_TAGS).concat(PIP_RANK_TAGS)
    .concat(CUSTOM_PAGES.map(p=>({id:p.id, name:p.name, eyebrow:"General & Themes", group:"General & Themes"})));
}

// ---------- storage ----------
function fetchWithTimeout(url, options, timeoutMs=30000){
  const controller = new AbortController();
  const id = setTimeout(()=>controller.abort(), timeoutMs);
  return fetch(url, {...options, signal: controller.signal}).finally(()=> clearTimeout(id));
}
// Retries a Dropbox call a couple of times with a short pause between —
// useful on higher-latency connections (cellular, satellite, antenna-based
// links) where a single attempt can time out even though the connection
// is fine overall.
async function withRetry(fn, retries=2, delayMs=4000){
  let lastErr;
  for(let attempt=0; attempt<=retries; attempt++){
    try{ return await fn(); }
    catch(e){
      lastErr = e;
      if(attempt < retries) await new Promise(r=>setTimeout(r, delayMs));
    }
  }
  throw lastErr;
}
// Two layers: localStorage is a fast local cache that always works, even
// offline. If Dropbox is connected, the same data also lives in one JSON
// file in the app's own Dropbox folder, so your phone and computer can
// both read/write the same notes instead of each having their own copy.
const STORAGE_KEY = "tarot-compendium-notes";
const CUSTOM_PAGES_KEY = "tarot-compendium-custom-pages";
const CARD_FIELDS_KEY = "tarot-compendium-card-fields";
let NOTES = []; // {id, cardIds:[], html, createdAt, updatedAt, order}

// ---- Dropbox config ----
const DROPBOX_APP_KEY = "raiwrwit2jr3l9p";
const DROPBOX_REDIRECT_URI = "https://ceebs13.github.io/tarot-compendium/";
const DROPBOX_DATA_PATH = "/tarot-compendium-data.json";

function b64url(bytes){
  return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function pkceChallenge(verifier){
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return b64url(digest);
}
function randomVerifier(){
  const arr = new Uint8Array(64);
  crypto.getRandomValues(arr);
  return b64url(arr);
}
async function startDropboxConnect(){
  const verifier = randomVerifier();
  sessionStorage.setItem('dbx_verifier', verifier);
  const challenge = await pkceChallenge(verifier);
  const params = new URLSearchParams({
    client_id: DROPBOX_APP_KEY,
    response_type: 'code',
    code_challenge: challenge,
    code_challenge_method: 'S256',
    redirect_uri: DROPBOX_REDIRECT_URI,
    token_access_type: 'offline'
  });
  window.location = 'https://www.dropbox.com/oauth2/authorize?' + params.toString();
}
async function completeDropboxConnectIfReturning(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(!code) return false;
  const verifier = sessionStorage.getItem('dbx_verifier');
  try{
    const resp = await fetchWithTimeout('https://api.dropboxapi.com/oauth2/token', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        code, grant_type:'authorization_code',
        client_id: DROPBOX_APP_KEY,
        redirect_uri: DROPBOX_REDIRECT_URI,
        code_verifier: verifier
      })
    });
    const data = await resp.json();
    if(data.access_token){
      localStorage.setItem('dbx_access_token', data.access_token);
      localStorage.setItem('dbx_refresh_token', data.refresh_token);
      localStorage.setItem('dbx_expires_at', String(Date.now() + data.expires_in*1000));
      window.history.replaceState({}, document.title, DROPBOX_REDIRECT_URI);
      return true;
    }
  }catch(e){ console.error('Dropbox connect failed', e); }
  return false;
}
function isDropboxConnected(){
  return !!localStorage.getItem('dbx_refresh_token');
}
function disconnectDropbox(){
  localStorage.removeItem('dbx_access_token');
  localStorage.removeItem('dbx_refresh_token');
  localStorage.removeItem('dbx_expires_at');
}
async function getValidDropboxToken(){
  const expiresAt = Number(localStorage.getItem('dbx_expires_at')||0);
  if(Date.now() < expiresAt - 60000){
    return localStorage.getItem('dbx_access_token');
  }
  const refreshToken = localStorage.getItem('dbx_refresh_token');
  if(!refreshToken) return null;
  const resp = await fetchWithTimeout('https://api.dropboxapi.com/oauth2/token', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams({ grant_type:'refresh_token', refresh_token: refreshToken, client_id: DROPBOX_APP_KEY })
  });
  const data = await resp.json();
  if(data.access_token){
    localStorage.setItem('dbx_access_token', data.access_token);
    localStorage.setItem('dbx_expires_at', String(Date.now() + data.expires_in*1000));
    return data.access_token;
  }
  return null;
}
async function dbxDownload(){
  const token = await getValidDropboxToken();
  if(!token) return null;
  const resp = await fetchWithTimeout('https://content.dropboxapi.com/2/files/download', {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+token, 'Dropbox-API-Arg': JSON.stringify({path: DROPBOX_DATA_PATH}) }
  });
  if(resp.status===409) return { notes: [], customPages: [], cardFields: {} }; // no file saved yet
  if(!resp.ok){
    const text = await resp.text().catch(()=>'');
    throw new Error('Dropbox download failed: '+resp.status+' — '+text);
  }
  return await resp.json();
}
async function dbxUpload(payload){
  const token = await getValidDropboxToken();
  if(!token) throw new Error('Not connected to Dropbox');
  const resp = await fetchWithTimeout('https://content.dropboxapi.com/2/files/upload', {
    method:'POST',
    headers:{
      'Authorization':'Bearer '+token,
      'Dropbox-API-Arg': JSON.stringify({path: DROPBOX_DATA_PATH, mode:'overwrite', mute:true}),
      'Content-Type':'application/octet-stream'
    },
    body: JSON.stringify(payload)
  });
  if(!resp.ok){
    const text = await resp.text().catch(()=>'');
    throw new Error('Dropbox upload failed: '+resp.status+' — '+text);
  }
}

function setSyncStatus(state, label){
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status ' + state;
  el.innerHTML = `<span class="dot"></span>${label}`;
}
function updateDropboxButton(){
  const btn = document.getElementById('dropboxBtn');
  const syncBtn = document.getElementById('syncNowBtn');
  btn.textContent = isDropboxConnected() ? 'Disconnect Dropbox' : 'Connect Dropbox';
  syncBtn.style.display = isDropboxConnected() ? 'inline-block' : 'none';
}

// Merge two {notes, customPages} sets. Notes/pages present on only one
// side are kept (union). If the same id exists on both sides, the one
// with the later updatedAt wins. Deletions don't sync perfectly across
// devices this way — if you delete something on one device, hit "Sync"
// on the other before trusting it's gone everywhere.
function mergeData(a, b){
  const noteMap = new Map();
  (a.notes||[]).forEach(n=>noteMap.set(n.id, n));
  (b.notes||[]).forEach(n=>{
    const existing = noteMap.get(n.id);
    if(!existing || (n.updatedAt||0) > (existing.updatedAt||0)) noteMap.set(n.id, n);
  });
  const pageMap = new Map();
  (a.customPages||[]).forEach(p=>pageMap.set(p.id, p));
  (b.customPages||[]).forEach(p=>pageMap.set(p.id, p));
  const fieldsMap = new Map();
  Object.entries(a.cardFields||{}).forEach(([id,f])=>fieldsMap.set(id,f));
  Object.entries(b.cardFields||{}).forEach(([id,f])=>{
    const existing = fieldsMap.get(id);
    if(!existing || (f.updatedAt||0) > (existing.updatedAt||0)) fieldsMap.set(id,f);
  });
  return { notes: Array.from(noteMap.values()), customPages: Array.from(pageMap.values()), cardFields: Object.fromEntries(fieldsMap) };
}

// Local cache now uses IndexedDB rather than localStorage — localStorage
// caps out at just a few MB, which a handful of image-heavy notes can
// blow through. IndexedDB's ceiling is vastly higher (typically hundreds
// of MB or more), so this stops being something you need to think about.
const IDB_NAME = "tarot-compendium-db";
const IDB_STORE = "kv";
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}

async function loadLocalCache(){
  try{ NOTES = (await idbGet(STORAGE_KEY)) || []; }catch(e){ console.error('Local load failed', e); NOTES = []; }
  try{ CUSTOM_PAGES = (await idbGet(CUSTOM_PAGES_KEY)) || []; }catch(e){ console.error('Local load failed', e); CUSTOM_PAGES = []; }
  try{ CARD_FIELDS = (await idbGet(CARD_FIELDS_KEY)) || {}; }catch(e){ console.error('Local load failed', e); CARD_FIELDS = {}; }
}
async function saveLocalCache(){
  try{
    await idbSet(STORAGE_KEY, NOTES);
    await idbSet(CUSTOM_PAGES_KEY, CUSTOM_PAGES);
    await idbSet(CARD_FIELDS_KEY, CARD_FIELDS);
    return true;
  }catch(e){
    console.error("Local save failed", e);
    return false;
  }
}

// Pull from Dropbox, merge with what's here, save the merged result both
// places. Call this on load and whenever the person hits "Sync now".
async function syncWithDropbox(){
  if(!isDropboxConnected()) return;
  setSyncStatus('busy', 'Syncing…');
  try{
    const remote = await withRetry(()=>dbxDownload());
    const merged = mergeData({notes:NOTES, customPages:CUSTOM_PAGES, cardFields:CARD_FIELDS}, remote || {notes:[],customPages:[],cardFields:{}});
    NOTES = merged.notes;
    CUSTOM_PAGES = merged.customPages;
    CARD_FIELDS = merged.cardFields;
    await saveLocalCache();
    await withRetry(()=>dbxUpload(merged));
    setSyncStatus('ok', 'Synced');
  }catch(e){
    console.error('Sync failed', e);
    setSyncStatus('error', 'Sync failed — saved locally');
  }
}

// Called after any local change: save the local cache (fast, no network),
// then push to Dropbox in the background if connected — the caller does
// NOT wait on the network call, so saving a note always feels instant
// regardless of connection speed. Dropbox syncing quietly catches up
// afterward, updating the status indicator when it's done.
async function persistNotes(){
  const localOk = await saveLocalCache();
  if(isDropboxConnected()){
    setSyncStatus('busy','Saving…');
    withRetry(()=>dbxUpload({notes:NOTES, customPages:CUSTOM_PAGES, cardFields:CARD_FIELDS}))
      .then(()=> setSyncStatus('ok','Synced'))
      .catch(e=>{
        console.error(e);
        setSyncStatus('error','Sync failed — saved locally');
        if(!localOk){
          alert("Could not save — neither the local cache nor Dropbox could be reached right now. Export a backup immediately if you can, so nothing is lost.");
        }
      });
  } else if(!localOk){
    alert("Could not save — your browser blocked local storage, and Dropbox isn't connected. Export a backup immediately if you can, so nothing is lost.");
  }
}
async function persistCustomPages(){ await persistNotes(); }
async function loadNotes(){ await loadLocalCache(); }
async function loadCustomPages(){ /* handled by loadLocalCache() */ }

function relevantTagIdsFor(cardId){
  const card = allPages().find(c=>c.id===cardId);
  const ids = [cardId];
  if(cardId === 'pip-overview'){
    ids.push(...PIP_RANK_TAGS.map(t=>t.id));
  }
  if(cardId === 'court-cards'){
    ids.push(...COURT_RANK_TAGS.map(t=>t.id));
  }
  if(card && GROUP_ORDER.includes(card.group)){
    ids.push(groupSlug(card.group));
  }
  if(card && card.rankType === 'court' && card.rank){
    ids.push('court-' + card.rank.toLowerCase());
  }
  if(card && card.rankType === 'pip' && card.rank){
    ids.push('pip-' + card.rank.toLowerCase());
  }
  return ids;
}
function noteHasImage(note){
  return /<img\b/i.test(note.html);
}
function noteIsNumerology(note){
  return note.cardIds.some(id => id==='pip-overview' || PIP_RANK_TAGS.some(t=>t.id===id));
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function renderSourceLine(note){
  if(note.source && note.sourceLink){
    return `<a href="${escapeHtml(note.sourceLink)}" target="_blank" rel="noopener">${escapeHtml(note.source)}</a>`;
  }
  if(note.sourceLink){
    return `<a href="${escapeHtml(note.sourceLink)}" target="_blank" rel="noopener">${escapeHtml(note.sourceLink)}</a>`;
  }
  if(note.source){
    return escapeHtml(note.source);
  }
  return '';
}
function groupRank(note){
  if(noteHasImage(note)) return 0;
  if(note.isKeywords) return 1;
  if(note.pinnedFirst) return 2;
  return 3;
}
function pipNumberFor(note){
  const nums = note.cardIds.map(id => PIP_RANK_TAGS.find(t=>t.id===id)).filter(Boolean).map(t=>t.pipNumber);
  return nums.length ? Math.min(...nums) : 99; // general (non-numbered) pip notes sort to the end
}
function notesForCard(cardId){
  const ids = relevantTagIdsFor(cardId);
  const list = NOTES.filter(n=> n.cardIds.some(id=>ids.includes(id)));
  return list.sort((a,b)=>{
    const ra = groupRank(a), rb = groupRank(b);
    if(ra !== rb) return ra - rb; // images first, then keywords, then pinned-first, then everything else
    if(cardId === 'pip-overview'){
      const pa = pipNumberFor(a), pb = pipNumberFor(b);
      if(pa !== pb) return pa - pb; // on the Pips overview, order by number (1–10)
    }
    return (a.order ?? a.createdAt) - (b.order ?? b.createdAt);
  });
}
function countForCard(cardId){
  return notesForCard(cardId).length;
}

// ---------- navigation state ----------
let currentCardId = null;
let editingNoteId = null;

const homeView = document.getElementById('homeView');
const cardView = document.getElementById('cardView');

function showHome(push=true){
  currentCardId = null;
  cardView.style.display = 'none';
  document.getElementById('sourcesView').style.display = 'none';
  document.getElementById('astrologyView').style.display = 'none';

function showCard(cardId, push=true){

  document.getElementById('sourcesView').style.display = 'none';
  document.getElementById('astrologyView').style.display = 'none';

function showSources(push=true){
  currentCardId = null;
  homeView.style.display = 'none';
  cardView.style.display = 'none';
  document.getElementById('astrologyView').style.display = 'none';
  document.getElementById('sourcesView').style.display = 'block';

function showAstrology(push=true){

  document.getElementById('astrologyView').style.display = 'block';

}
// Makes the browser's own back/forward buttons move between pages inside
// the app, instead of leaving it entirely.
window.addEventListener('popstate', (e)=>{
  const state = e.state;
  if(state && state.view==='card' && state.cardId){
    showCard(state.cardId, false);
  } else if(state && state.view==='sources'){
    showSources(false);
  } else if(state && state.view==='astrology'){
    showAstrology(false);
  } else {
    showHome(false);
  }
});
document.getElementById('sourcesLink').onclick = ()=> showSources();
document.getElementById('astrologyLink').onclick = ()=> showAstrology();
document.getElementById('brandLink').onclick = ()=> showHome();
document.getElementById('sourcesBackLink').onclick = ()=> showHome();
document.getElementById('astrologyBackLink').onclick = ()=> showHome();
document.getElementById('deletePageBtn').onclick = ()=>{
  if(!currentCardId) return;
  const page = CUSTOM_PAGES.find(p=>p.id===currentCardId);
  if(!page) return;
  if(confirm(`Delete the page "${page.name}"? Notes tagged here stay saved, but this page will no longer exist to view them on — remove the tag from any note you want to keep visible elsewhere first.`)){
    CUSTOM_PAGES = CUSTOM_PAGES.filter(p=>p.id!==currentCardId);
    persistCustomPages();
    showHome();
  }
};

function updateNoteCount(){
  const el = document.getElementById('noteCount');
  if(el) el.innerHTML = `<span class="dot" style="background:var(--brass);"></span>${NOTES.length} note${NOTES.length===1?'':'s'}`;
}
function renderHome(filter){
  updateNoteCount();
  filter = (filter||'').toLowerCase();
  homeView.innerHTML = '';
  GROUP_ORDER.forEach(group=>{
    const cards = CARDS.filter(c=>c.group===group && c.name.toLowerCase().includes(filter));
    if(cards.length===0) return;
    const heading = document.createElement('div');
    heading.className = 'suit-heading';
    heading.textContent = group;
    homeView.appendChild(heading);
    const grid = document.createElement('div');
    grid.className = 'grid';
    cards.forEach(c=>{
      const tile = document.createElement('div');
      tile.className='card-tile';
      const n = countForCard(c.id);
      tile.innerHTML = `<div><div class="card-num">${c.eyebrow}</div><div class="card-name">${c.name}</div></div>
        <div class="card-count ${n===0?'empty':''}">${n} note${n===1?'':'s'}</div>`;
      tile.onclick = ()=> showCard(c.id);
      grid.appendChild(tile);
    });
    homeView.appendChild(grid);
  });

  // Suit & Arcana tags — tag a note here and it cascades onto every card
  // in that group automatically (e.g. tag "Wands (all cards)" and it shows
  // up on Ace through King of Wands too).
  const tagHeading = document.createElement('div');
  tagHeading.className = 'suit-heading';
  tagHeading.textContent = 'Suit & Arcana Tags';
  homeView.appendChild(tagHeading);
  const tagGrid = document.createElement('div');
  tagGrid.className = 'grid';
  GROUP_TAGS.concat([COURT_TAG, PIP_OVERVIEW_TAG]).filter(g=>g.name.toLowerCase().includes(filter)).forEach(g=>{
    const tile = document.createElement('div');
    tile.className='card-tile';
    const count = countForCard(g.id);
    tile.innerHTML = `<div><div class="card-num">Cascades to every card</div><div class="card-name">${g.name}</div></div>
      <div class="card-count ${count===0?'empty':''}">${count} note${count===1?'':'s'}</div>`;
    tile.onclick = ()=> showCard(g.id);
    tagGrid.appendChild(tile);
  });
  homeView.appendChild(tagGrid);

  // General & Themes — free-form pages for suit overviews, numerology, or anything
  // broader than a single card. Always shown so the option to add one stays visible.
  const themeHeading = document.createElement('div');
  themeHeading.className = 'suit-heading';
  themeHeading.textContent = 'General & Themes';
  homeView.appendChild(themeHeading);
  const themeGrid = document.createElement('div');
  themeGrid.className = 'grid';
  CUSTOM_PAGES.filter(p=>p.name.toLowerCase().includes(filter)).forEach(p=>{
    const tile = document.createElement('div');
    tile.className='card-tile';
    const n = countForCard(p.id);
    tile.innerHTML = `<div><div class="card-num">General & Themes</div><div class="card-name">${p.name}</div></div>
      <div class="card-count ${n===0?'empty':''}">${n} note${n===1?'':'s'}</div>`;
    tile.onclick = ()=> showCard(p.id);
    themeGrid.appendChild(tile);
  });
  const addTile = document.createElement('div');
  addTile.className = 'card-tile add-tile';
  addTile.innerHTML = `<div><div style="font-size:26px; line-height:1;">+</div><div class="card-name" style="font-size:14px; margin-top:6px;">New page</div></div>`;
  addTile.onclick = addCustomPage;
  themeGrid.appendChild(addTile);
  homeView.appendChild(themeGrid);
}

function addCustomPage(){
  const name = prompt('Name this page — e.g. "Wands overview", "Numerology: the Fours", "Reversals":');
  if(!name || !name.trim()) return;
  const id = 'custom-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  CUSTOM_PAGES.push({id, name: name.trim()});
  persistCustomPages();
  renderHome(document.getElementById('searchBox').value);
}

function eyebrowHtml(card){
  if(card.group === 'Major Arcana'){
    const num = (card.eyebrow.split('·')[1] || '').trim();
    return `<a href="javascript:void(0)" class="eyebrow-link" data-goto="${groupSlug('Major Arcana')}">Major Arcana</a> · ${escapeHtml(num)}`;
  }
  if(GROUP_ORDER.includes(card.group)){
    return `Minor Arcana · <a href="javascript:void(0)" class="eyebrow-link" data-goto="${groupSlug(card.group)}">${escapeHtml(card.group)}</a>`;
  }
  return escapeHtml(card.eyebrow);
}
function computeSourcesIndex(){
  const map = new Map();
  NOTES.forEach(note=>{
    const source = (note.source||'').trim();
    const link = (note.sourceLink||'').trim();
    if(!source && !link) return;
    const title = source || link; // link-only notes use the link itself as the heading
    const key = title.toLowerCase();
    if(!map.has(key)) map.set(key, {title, links: new Set(), pageIds: new Set()});
    const entry = map.get(key);
    if(source && link) entry.links.add(link); // only nest a link when there's a separate title to nest it under
    note.cardIds.forEach(id=> entry.pageIds.add(id));
  });
  return Array.from(map.values());
}
function renderSources(){
  updateNoteCount();
  const list = document.getElementById('sourcesList');
  const entries = computeSourcesIndex().sort((a,b)=> a.title.localeCompare(b.title, undefined, {sensitivity:'base'}));
  list.innerHTML = '';
  if(entries.length===0){
    list.innerHTML = `<div class="empty-state">No sources logged yet. Add a Source or Link to any note and it'll show up here automatically.</div>`;
    return;
  }
  entries.forEach(entry=>{
    const el = document.createElement('div');
    el.className = 'entry';
    const linksHtml = entry.links.size
      ? Array.from(entry.links).map(link=>`<div><a href="${escapeHtml(link)}" target="_blank" rel="noopener">${escapeHtml(link)}</a></div>`).join('')
      : '';
    const pageLinksHtml = Array.from(entry.pageIds).map(id=>{
      const page = allPages().find(p=>p.id===id);
      return page ? `<span class="eyebrow-link source-page-link" data-goto="${id}">${escapeHtml(page.name)}</span>` : '';
    }).filter(Boolean).join(', ');
    el.innerHTML = `<div class="entry-body" style="font-size:17px; font-weight:600;">${escapeHtml(entry.title)}</div>
      ${linksHtml ? `<div class="entry-source" style="margin:4px 0 8px; font-style:normal;">${linksHtml}</div>` : ''}
      <div class="entry-source" style="font-style:normal;">Appears on: ${pageLinksHtml || '—'}</div>`;
    list.appendChild(el);
    el.querySelectorAll('.source-page-link').forEach(a=> a.addEventListener('click', ()=> showCard(a.dataset.goto)));
  });
}
function renderAstrology(){
  updateNoteCount();
  const list = document.getElementById('astrologyList');
  list.innerHTML = '';
  CARDS.forEach(card=>{
    const el = document.createElement('div');
    el.className = 'entry';
    const current = (CARD_FIELDS[card.id] && CARD_FIELDS[card.id].astro) || '';
    el.innerHTML = `<div class="entry-body" style="display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;">
        <span class="eyebrow-link astro-card-link" data-goto="${card.id}" style="font-weight:600; font-size:16px;">${escapeHtml(card.name)}</span>
        <input type="text" class="tag-input astro-editor-input" data-card="${card.id}" value="${escapeHtml(current)}" style="max-width:280px; flex:1; min-width:200px;"/>
      </div>`;
    list.appendChild(el);
  });
  list.querySelectorAll('.astro-card-link').forEach(a=> a.addEventListener('click', ()=> showCard(a.dataset.goto)));
  list.querySelectorAll('.astro-editor-input').forEach(inp=>{
    inp.addEventListener('blur', ()=> saveCardField(inp.dataset.card, 'astro', inp.value));
  });
}
function saveCardField(cardId, field, value){
  const existing = CARD_FIELDS[cardId] || {};
  existing[field] = value.trim();
  existing.updatedAt = Date.now();
  CARD_FIELDS[cardId] = existing;
  persistNotes();
}
function renderCard(cardId){
  updateNoteCount();
  const card = allPages().find(c=>c.id===cardId);
  document.getElementById('pageEyebrow').innerHTML = eyebrowHtml(card);
  document.getElementById('pageEyebrow').querySelectorAll('.eyebrow-link').forEach(a=>{
    a.addEventListener('click', ()=> showCard(a.dataset.goto));
  });
  document.getElementById('pageTitle').textContent = card.name;
  document.getElementById('deletePageBtn').style.display = cardId.startsWith('custom-') ? 'inline-block' : 'none';

  const cardNav = document.getElementById('cardNav');
  const deckIndex = CARDS.findIndex(c=>c.id===cardId);
  if(deckIndex !== -1){
    const prevCard = CARDS[(deckIndex - 1 + CARDS.length) % CARDS.length];
    const nextCard = CARDS[(deckIndex + 1) % CARDS.length];
    document.getElementById('prevCardLink').textContent = '‹ ' + prevCard.name;
    document.getElementById('nextCardLink').textContent = nextCard.name + ' ›';
    document.getElementById('prevCardLink').onclick = ()=> showCard(prevCard.id);
    document.getElementById('nextCardLink').onclick = ()=> showCard(nextCard.id);
    cardNav.style.display = 'flex';
  } else {
    cardNav.style.display = 'none'; // group-tag and custom pages don't have a natural next/prev
  }

  const entries = document.getElementById('entries');
  entries.innerHTML = '';
  const list = notesForCard(cardId);
  const astroValue = deckIndex !== -1 ? ((CARD_FIELDS[cardId] && CARD_FIELDS[cardId].astro) || '') : '';

  function insertAstroLine(){
    if(!astroValue) return;
    const el = document.createElement('div');
    el.className = 'entry astro-display';
    el.innerHTML = `<div class="entry-body"><span class="field-label-inline">Astrological Association:</span> ${escapeHtml(astroValue)}</div>`;
    entries.appendChild(el);
  }

  if(list.length===0){
    insertAstroLine();
    if(!astroValue){
      entries.innerHTML = `<div class="empty-state">No notes yet on this page. Add one, and it'll appear here — and stay here as you add more.</div>`;
    }
    return;
  }
  let astroInserted = false;
  list.forEach(note=>{
    if(!astroInserted && !noteHasImage(note)){
      insertAstroLine();
      astroInserted = true;
    }
    const el = document.createElement('div');
    const isNumerology = noteIsNumerology(note);
    el.className = 'entry'
      + (noteHasImage(note) ? ' has-images' : '')
      + (note.isKeywords ? ' is-keywords' : '')
      + (note.isGuidance ? ' is-guidance' : '')
      + (note.isHerb ? ' is-herb' : '')
      + (isNumerology ? ' is-numerology' : '');
    const labels = [];
    if(note.isGuidance) labels.push('Guidance');
    if(isNumerology) labels.push('Numerology');
    const labelsHtml = labels.map(l=>`<div class="field-label-inline" style="margin-bottom:4px;">${l.toUpperCase()}:</div>`).join('');
    const otherTags = note.cardIds.filter(id=>id!==cardId).map(id=>allPages().find(c=>c.id===id)?.name).filter(Boolean);
    el.innerHTML = `<div class="entry-meta">
        <span><span class="drag-handle" title="Drag to reorder">⠿⠿</span>${otherTags.length? ' Also on: '+otherTags.join(', '):''}</span>
        <span class="entry-actions"><span data-act="edit">✎ edit</span><span data-act="del">✕ delete</span></span>
      </div>
      <div class="entry-body">${labelsHtml}${note.html}</div>
      ${(note.source || note.sourceLink) ? `<div class="entry-source">(${renderSourceLine(note)})</div>` : ''}`;
    el.querySelector('[data-act="edit"]').onclick = ()=> openModal(note.id);
    el.querySelector('[data-act="del"]').onclick = async ()=>{
      if(confirm('Delete this note? This removes it from every page it was tagged to.')){
        NOTES = NOTES.filter(n=>n.id!==note.id);
        await persistNotes();
        renderCard(cardId);
      }
    };
    entries.appendChild(el);
    attachDragHandlers(el, el.querySelector('.drag-handle'), note.id);
    el.querySelectorAll('.entry-body img').forEach(img=>{
      img.addEventListener('click', ()=> openLightbox(img.src));
    });
  });
  if(!astroInserted) insertAstroLine();
}

// ---------- drag-to-reorder ----------
let dragSourceId = null;
function attachDragHandlers(entryEl, handleEl, noteId){
  handleEl.draggable = true;
  handleEl.addEventListener('dragstart', (e)=>{
    dragSourceId = noteId;
    e.dataTransfer.effectAllowed = 'move';
    entryEl.classList.add('dragging');
  });
  handleEl.addEventListener('dragend', ()=>{ entryEl.classList.remove('dragging'); dragSourceId = null; });
  entryEl.addEventListener('dragover', (e)=>{ e.preventDefault(); entryEl.classList.add('drag-over'); });
  entryEl.addEventListener('dragleave', ()=> entryEl.classList.remove('drag-over'));
  entryEl.addEventListener('drop', async (e)=>{
    e.preventDefault();
    entryEl.classList.remove('drag-over');
    if(!dragSourceId || dragSourceId===noteId) return;
    await reorderNotes(currentCardId, dragSourceId, noteId);
  });
}
async function reorderNotes(cardId, sourceId, targetId){
  const list = notesForCard(cardId); // array of live references into NOTES
  const fromIdx = list.findIndex(n=>n.id===sourceId);
  const toIdx = list.findIndex(n=>n.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  const [moved] = list.splice(fromIdx,1);
  list.splice(toIdx,0,moved);
  list.forEach((n,i)=> n.order = i*10);
  await persistNotes();
  renderCard(cardId);
}

function openModal(noteId){
  editingNoteId = noteId || null;
  document.getElementById('modalTitle').textContent = noteId ? 'Edit note' : 'New note';
  document.getElementById('deleteNoteBtn').style.display = noteId ? 'inline-block' : 'none';
  exitCodeMode(); // always start in rich-text view
  if(noteId){
    const note = NOTES.find(n=>n.id===noteId);
    editor.innerHTML = note.html;
    selectedTags = [...note.cardIds];
    document.getElementById('sourceInput').value = note.source || '';
    document.getElementById('sourceLinkInput').value = note.sourceLink || '';
    document.getElementById('orderInput').value = (note.order !== undefined && note.order !== null) ? note.order : '';
    document.getElementById('keywordsInput').checked = !!note.isKeywords;
    document.getElementById('guidanceInput').checked = !!note.isGuidance;
    document.getElementById('herbInput').checked = !!note.isHerb;
    document.getElementById('pinFirstInput').checked = !!note.pinnedFirst;
  } else {
    editor.innerHTML = '';
    selectedTags = currentCardId ? [currentCardId] : [];
    document.getElementById('sourceInput').value = '';
    document.getElementById('sourceLinkInput').value = '';
    document.getElementById('orderInput').value = '';
    document.getElementById('keywordsInput').checked = false;
    document.getElementById('guidanceInput').checked = false;
    document.getElementById('herbInput').checked = false;
    document.getElementById('pinFirstInput').checked = false;
  }
  renderChips();
  tagInput.value = '';
  overlay.classList.add('open');
  setTimeout(()=>editor.focus(), 50);
}
function closeModal(){
  overlay.classList.remove('open');
  editingNoteId = null;
}
document.getElementById('modalClose').onclick = closeModal;
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

document.getElementById('fabAdd').onclick = ()=> openModal(null);
document.getElementById('addNoteForThisCard').onclick = ()=> openModal(null);

function renderChips(){
  chipsEl.innerHTML = '';
  selectedTags.forEach(id=>{
    const card = allPages().find(c=>c.id===id);
    if(!card) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `${card.name} <span>×</span>`;
    chip.querySelector('span').onclick = ()=>{
      selectedTags = selectedTags.filter(t=>t!==id);
      renderChips();
    };
    chipsEl.appendChild(chip);
  });
}

tagInput.addEventListener('input', ()=>{
  const q = tagInput.value.toLowerCase().trim();
  if(!q){ tagDropdown.classList.remove('open'); return; }
  const matches = allPages().filter(c=>c.name.toLowerCase().includes(q) && !selectedTags.includes(c.id)).slice(0,8);
  tagDropdown.innerHTML = '';
  matches.forEach(c=>{
    const opt = document.createElement('div');
    opt.className = 'tag-option';
    opt.textContent = c.name;
    opt.onclick = ()=>{
      selectedTags.push(c.id);
      renderChips();
      tagInput.value='';
      tagDropdown.classList.remove('open');
    };
    tagDropdown.appendChild(opt);
  });
  const exactMatch = allPages().some(c=>c.name.toLowerCase()===q);
  if(!exactMatch){
    const rawName = tagInput.value.trim();
    const createOpt = document.createElement('div');
    createOpt.className = 'tag-option';
    createOpt.style.color = 'var(--oxblood)';
    createOpt.style.borderTop = matches.length ? '1px solid rgba(33,26,20,0.15)' : 'none';
    createOpt.textContent = `+ Create new page "${rawName}"`;
    createOpt.onclick = ()=>{
      const id = 'custom-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      CUSTOM_PAGES.push({id, name: rawName});
      persistCustomPages();
      selectedTags.push(id);
      renderChips();
      tagInput.value='';
      tagDropdown.classList.remove('open');
    };
    tagDropdown.appendChild(createOpt);
  }
  tagDropdown.classList.add('open');
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.tag-select')) tagDropdown.classList.remove('open');
});

// code view toggle
const editorCode = document.getElementById('editorCode');
const codeToggleBtn = document.getElementById('codeToggleBtn');
let codeMode = false;
function setFormattingButtonsDisabled(disabled){
  document.querySelectorAll('.toolbar button:not(#codeToggleBtn)').forEach(b=> b.disabled = disabled);
}
function enterCodeMode(){
  if(codeMode) return;
  editorCode.value = editor.innerHTML;
  editor.style.display = 'none';
  editorCode.style.display = 'block';
  codeToggleBtn.classList.add('active');
  setFormattingButtonsDisabled(true);

function exitCodeMode(){
  if(!codeMode){ editor.style.display='block'; editorCode.style.display='none'; return; }
  editor.innerHTML = editorCode.value;
  editor.style.display = 'block';
  editorCode.style.display = 'none';
  codeToggleBtn.classList.remove('active');

  codeMode = false;

codeToggleBtn.addEventListener('click', ()=>{

});

// toolbar
document.querySelectorAll('.toolbar [data-cmd]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    editor.focus();

// image insert with client-side resize
document.getElementById('imgBtn').onclick = ()=> document.getElementById('imgFile').click();
document.getElementById('imgFile').addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files || []);
  for(const file of files){
    const dataUrl = await resizeImage(file, 600, 0.8);
    editor.focus();
    document.execCommand('insertHTML', false, `<img src="${dataUrl}">`);
  }
  e.target.value = '';
});
function resizeImage(file, maxDim, quality){
  const preservesTransparency = /png|gif|webp/.test(file.type);
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w=maxDim; }
          else { w = Math.round(w*maxDim/h); h=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        // PNGs/GIFs/WebP may have transparent backgrounds — keep them as PNG
        // so that stays intact. Everything else (photos) goes out as a
        // smaller JPEG, since there's no transparency to lose there anyway.
        resolve(preservesTransparency ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// save / delete
document.getElementById('saveNoteBtn').onclick = async ()=>{
  const html = (codeMode ? editorCode.value : editor.innerHTML).trim();
  if(!html || html==='<br>'){ alert('Write something in the note first.'); return; }
  if(selectedTags.length===0){ alert('Tag this note to at least one card so it knows which page to appear on.'); return; }
  const source = document.getElementById('sourceInput').value.trim();
  const sourceLink = document.getElementById('sourceLinkInput').value.trim();
  const orderVal = document.getElementById('orderInput').value.trim();
  const isKeywords = document.getElementById('keywordsInput').checked;
  const isGuidance = document.getElementById('guidanceInput').checked;
  const isHerb = document.getElementById('herbInput').checked;
  const pinnedFirst = document.getElementById('pinFirstInput').checked;
  if(editingNoteId){
    const note = NOTES.find(n=>n.id===editingNoteId);
    note.html = html;
    note.cardIds = [...selectedTags];
    note.updatedAt = Date.now();
    note.source = source;
    note.sourceLink = sourceLink;
    note.isKeywords = isKeywords;
    note.isGuidance = isGuidance;
    note.isHerb = isHerb;
    note.pinnedFirst = pinnedFirst;
    if(orderVal !== '') note.order = Number(orderVal);
  } else {
    NOTES.push({
      id: 'n'+Date.now()+Math.random().toString(36).slice(2,7),
      cardIds:[...selectedTags], html,
      createdAt: Date.now(), updatedAt: Date.now(),
      order: orderVal !== '' ? Number(orderVal) : Date.now(),
      isKeywords, isGuidance, isHerb, pinnedFirst, source, sourceLink
    });
  }
  await persistNotes();
  closeModal();
  if(currentCardId) renderCard(currentCardId); else renderHome(document.getElementById('searchBox').value);
};
document.getElementById('deleteNoteBtn').onclick = async ()=>{
  if(!editingNoteId) return;
  if(confirm('Delete this note?')){
    NOTES = NOTES.filter(n=>n.id!==editingNoteId);
    await persistNotes();
    closeModal();
    if(currentCardId) renderCard(currentCardId); else renderHome();
  }
};

// backup export/import
document.getElementById('exportBtn').onclick = ()=>{
  const payload = { notes: NOTES, customPages: CUSTOM_PAGES, cardFields: CARD_FIELDS };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tarot-compendium-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      // Support both the current format ({notes, customPages, cardFields}) and
      // older backups (plain array of notes, or missing cardFields).
      const importedNotes = Array.isArray(parsed) ? parsed : (parsed.notes || []);
      const importedPages = Array.isArray(parsed) ? [] : (parsed.customPages || []);
      const importedFields = Array.isArray(parsed) ? {} : (parsed.cardFields || {});
      if(!Array.isArray(importedNotes)) throw new Error('bad format');
      const noteCount = importedNotes.length;
      const pageCount = importedPages.length;
      if(confirm(`Import ${noteCount} notes and ${pageCount} custom page(s)? This merges with what's already here (duplicates by id are skipped).`)){
        const existingNoteIds = new Set(NOTES.map(n=>n.id));
        importedNotes.forEach(n=>{ if(!existingNoteIds.has(n.id)) NOTES.push(n); });
        const existingPageIds = new Set(CUSTOM_PAGES.map(p=>p.id));
        importedPages.forEach(p=>{ if(!existingPageIds.has(p.id)) CUSTOM_PAGES.push(p); });
        Object.entries(importedFields).forEach(([id,f])=>{
          const existing = CARD_FIELDS[id];
          if(!existing || (f.updatedAt||0) > (existing.updatedAt||0)) CARD_FIELDS[id] = f;
        });
        await persistNotes();
        if(currentCardId) renderCard(currentCardId); else renderHome();
        alert('Import complete.');
      }
    }catch(err){
      alert('Could not read that file — make sure it\'s a backup exported from this app.');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

document.getElementById('syncNowBtn').onclick = async ()=>{
  await syncWithDropbox();
  if(currentCardId) renderCard(currentCardId); else renderHome(document.getElementById('searchBox').value);
};
document.getElementById('dropboxBtn').onclick = async ()=>{
  if(isDropboxConnected()){
    if(confirm('Disconnect Dropbox? Your notes stay right here on this device — this just stops syncing to your other devices until you reconnect.')){
      disconnectDropbox();
      updateDropboxButton();
      setSyncStatus('', 'Not connected');
    }
  } else {
    await startDropboxConnect();
  }
};

// ---------- init ----------
function bootstrapRoute(){
  const hash = decodeURIComponent(location.hash.replace(/^#/, ''));
  if(hash === 'sources'){
    showSources(false);
    history.replaceState({view:'sources'}, '', '#sources');
  } else if(hash === 'astrology'){
    showAstrology(false);
    history.replaceState({view:'astrology'}, '', '#astrology');
  } else if(hash && allPages().some(c=>c.id===hash)){
    showCard(hash, false);
    history.replaceState({view:'card', cardId:hash}, '', location.hash);
  } else {
    showHome(false);
    history.replaceState({view:'home'}, '', location.pathname + location.search);
  }
}

(async function init(){
  await loadLocalCache(); // show whatever's saved on this device immediately, no waiting on the network
  const justConnected = await completeDropboxConnectIfReturning();
  updateDropboxButton();
  bootstrapRoute();
  if(isDropboxConnected()){
    await syncWithDropbox();
    renderHome(document.getElementById('searchBox').value);
    if(currentCardId) renderCard(currentCardId);
  } else {
    setSyncStatus('', 'Not connected');
  }
})();
